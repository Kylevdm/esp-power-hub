substitutions:
  name: esp-power-hub
  friendly_name: ESP Power Hub

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: 900
    then:
      # Enable RS485 5V power (inverted: true means writing ON drives pin LOW)
      - output.turn_on: rs485_5v_enable
      # Enable RS485 auto-direction mode
      - output.turn_on: rs485_se_enable
      # Enable RS485 receiver
      - output.turn_on: rs485_re_enable

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_password

external_components:
  - source: github://Kylevdm/esphome-emerson-vertiv-r48
    components: [emerson_r48]
  - source:
      type: local
      path: components

# --- T-CAN485 RS485 control pins ---
output:
  - platform: gpio
    id: rs485_5v_enable
    pin:
      number: GPIO16
      inverted: true
  - platform: gpio
    id: rs485_se_enable
    pin:
      number: GPIO17
      inverted: true
  - platform: gpio
    id: rs485_re_enable
    pin:
      number: GPIO19
      inverted: true

# --- UART for RS485 (Seplos V3 BMS) ---
uart:
  - id: rs485_uart
    tx_pin: GPIO22
    rx_pin: GPIO21
    baud_rate: 19200

# --- Modbus RTU over RS485 ---
modbus:
  - id: modbus0
    uart_id: rs485_uart
    send_wait_time: 200ms

modbus_controller:
  - id: bms_pack_0
    modbus_id: modbus0
    address: 0x00
    command_throttle: 200ms
    update_interval: 10s
  - id: bms_pack_1
    modbus_id: modbus0
    address: 0x01
    command_throttle: 200ms
    update_interval: 10s

# --- CAN bus for Emerson/Vertiv R48-3000e3 ---
canbus:
  - platform: esp32_can
    id: can_bus
    tx_pin: GPIO27
    rx_pin: GPIO26
    can_id: 0x0607FF83
    bit_rate: 125kbps
    use_extended_id: true

# --- Emerson R48 rectifier ---
emerson_r48:
  id: rectifier
  canbus_id: can_bus
  update_interval: 1s

# --- Charge controller ---
charge_controller:
  id: charger
  relay_pin: GPIO32

  packs:
    - min_cell_voltage: bms0_min_cell_voltage
      max_cell_voltage: bms0_max_cell_voltage
      pack_voltage: bms0_pack_voltage
      pack_current: bms0_pack_current
      soc: bms0_soc
      max_temperature: bms0_max_cell_temperature
    - min_cell_voltage: bms1_min_cell_voltage
      max_cell_voltage: bms1_max_cell_voltage
      pack_voltage: bms1_pack_voltage
      pack_current: bms1_pack_current
      soc: bms1_soc
      max_temperature: bms1_max_cell_temperature

  rectifier:
    voltage_sensor: rectifier_output_voltage
    current_sensor: rectifier_output_current
    voltage_number: rectifier_set_voltage
    current_number: rectifier_set_current
    dc_switch: rectifier_dc_switch

# --- BMS pack sensor packages ---
packages:
  bms_pack_0: !include
    file: packages/bms_pack.yaml
    vars:
      pack_id: bms_pack_0
      pack_prefix: bms0
      pack_name: "Pack 0"
  bms_pack_1: !include
    file: packages/bms_pack.yaml
    vars:
      pack_id: bms_pack_1
      pack_prefix: bms1
      pack_name: "Pack 1"

# --- Rectifier sensors ---
sensor:
  - platform: emerson_r48
    output_voltage:
      id: rectifier_output_voltage
      name: "Rectifier Output Voltage"
    output_current:
      id: rectifier_output_current
      name: "Rectifier Output Current"
    output_power:
      name: "Rectifier Output Power"
    input_voltage:
      name: "Rectifier Input Voltage"
    input_power:
      name: "Rectifier Input Power"
    output_temp:
      name: "Rectifier Temperature"

  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

  - platform: uptime
    name: "Uptime"
    update_interval: 60s

# --- Rectifier control numbers ---
number:
  - platform: emerson_r48
    output_voltage:
      id: rectifier_set_voltage
      name: "Rectifier Voltage Setpoint"
    max_output_current:
      id: rectifier_set_current
      name: "Rectifier Current Limit"
    max_input_current:
      name: "Rectifier Input Current Limit"

  - platform: charge_controller
    bulk_voltage:
      name: "Bulk Voltage"
    float_voltage:
      name: "Float Voltage"
    max_charge_current:
      name: "Max Charge Current"
    absorb_tail_current:
      name: "Absorb Tail Current"
    absorb_max_time:
      name: "Absorb Max Time"
    rebulk_soc:
      name: "Re-bulk SOC"
    alarm_cell_high:
      name: "Alarm Cell High"
    alarm_cell_low:
      name: "Alarm Cell Low"
    alarm_temp_high:
      name: "Alarm Temperature High"
    comms_timeout:
      name: "Comms Timeout"

# --- Rectifier switches ---
switch:
  - platform: emerson_r48
    dc_sw:
      id: rectifier_dc_switch
      name: "Rectifier DC Output"
    ac_sw:
      name: "Rectifier AC Input"
    fan_sw:
      name: "Rectifier Fan"
    led_sw:
      name: "Rectifier LED"

  - platform: charge_controller
    charging_enabled:
      name: "Charging Enabled"

# --- Charge controller entities ---
text_sensor:
  - platform: charge_controller
    charge_state:
      name: "Charge State"
    alarm_reason:
      name: "Alarm Reason"

binary_sensor:
  - platform: charge_controller
    system_healthy:
      name: "System Healthy"
    relay_state:
      name: "Relay State"
