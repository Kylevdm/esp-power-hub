sensor:
  - platform: modbus_controller
    modbus_controller_id: ${pack_id}
    id: ${pack_prefix}_pack_voltage
    name: "${pack_name} Voltage"
    address: 0x1000
    register_type: read
    value_type: U_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: ${pack_id}
    id: ${pack_prefix}_pack_current
    name: "${pack_name} Current"
    address: 0x1001
    register_type: read
    value_type: S_WORD
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: ${pack_id}
    id: ${pack_prefix}_remaining_capacity
    name: "${pack_name} Remaining Capacity"
    address: 0x1002
    register_type: read
    value_type: U_WORD
    unit_of_measurement: "Ah"
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: ${pack_id}
    id: ${pack_prefix}_total_capacity
    name: "${pack_name} Total Capacity"
    address: 0x1003
    register_type: read
    value_type: U_WORD
    unit_of_measurement: "Ah"
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - multiply: 0.01

  - platform: modbus_controller
