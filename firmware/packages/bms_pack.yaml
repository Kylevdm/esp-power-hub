    address: 0x1005
    register_type: read
    value_type: U_WORD
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: ${pack_id}
    id: ${pack_prefix}_soh
    name: "${pack_name} SOH"
    address: 0x1006
    register_type: read
    value_type: U_WORD
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 0

  - platform: modbus_controller
    modbus_controller_id: ${pack_id}
    id: ${pack_prefix}_cycles
    name: "${pack_name} Cycles"
    address: 0x1007
    register_type: read
    value_type: U_WORD
    state_class: total_increasing
    accuracy_decimals: 0

  - platform: modbus_controller
    modbus_controller_id: ${pack_id}
    id: ${pack_prefix}_avg_cell_voltage
    name: "${pack_name} Average Cell Voltage"
    address: 0x1008
    register_type: read
    value_type: U_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  - platform: modbus_controller
